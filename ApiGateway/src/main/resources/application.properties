# =============================================================================
# CORRECTED API GATEWAY CONFIGURATION
# =============================================================================

# Application Configuration
spring.application.name=ApiGateway
server.port=9090

# JWT Configuration
jwt.secret=doritech_pUnQ10zB_pWUub3SxPGy_i0_fRyuGy912TZO4ZIiuwpreQ_Ax6KkzZ61jhCKv45WXsqsYZvnoMC786isTF5TFw==
jwt.expiration=3600000

# Database Configuration (for logging)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Gateway Discovery Configuration (DISABLED to use manual routes)
spring.cloud.gateway.discovery.locator.enabled=false

# Gateway HTTP Client Configuration
spring.cloud.gateway.httpclient.connect-timeout=30000
spring.cloud.gateway.httpclient.response-timeout=60s
spring.cloud.gateway.httpclient.pool.acquire-timeout=45000

# =============================================================================
# MANUAL ROUTES CONFIGURATION (Static URLs for debugging)
# =============================================================================

# Employee Service Route (Port corrected to 9091)
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=http://localhost:9091
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee/**

# Customer Service Route (Port corrected to 9092) 
spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=http://localhost:9092
spring.cloud.gateway.routes[1].predicates[0]=Path=/customers/**

# Auth Service Route (Port corrected to 9093)
spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=http://localhost:9093
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**

#Product Service Route (Port corrected to 9094)
spring.cloud.gateway.routes[3].id=product-service
spring.cloud.gateway.routes[3].uri=http://localhost:9094
spring.cloud.gateway.routes[3].predicates[0]=Path=/product/**


# Lead Service Route (Port corrected to 9095)
spring.cloud.gateway.routes[4].id=lead-service
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/leads/**

# Menu Access Service Route
spring.cloud.gateway.routes[5].id=menu-access-service
spring.cloud.gateway.routes[5].uri=http://localhost:9095
spring.cloud.gateway.routes[5].predicates[0]=Path=/menu/**


# Complaint Service Route (Port 9096)
spring.cloud.gateway.routes[6].id=complaint-service
spring.cloud.gateway.routes[6].uri=http://localhost:9096
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/complaints/**

spring.cloud.gateway.routes[7].id=competitor-service
spring.cloud.gateway.routes[7].uri=http://localhost:9097
spring.cloud.gateway.routes[7].predicates[0]=Path=/competitor/**

spring.cloud.gateway.routes[8].id=ActivityService
spring.cloud.gateway.routes[8].uri=http://localhost:9098
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/activities/**


# =============================================================================
# ACTUATOR CONFIGURATION
# =============================================================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.doritech.microservice=DEBUG
logging.level.reactor.netty.http.client=DEBUG



# =============================================================================
# OPTIONAL: Load Balancer Routes (Enable after debugging)
