# Spring Application Name
spring.application.name=competitor-api

server.port=9097

spring.datasource.url=jdbc:mysql://localhost:3306/competitor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update  

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.format_sql=true  # Optional: This will format the SQL for readability
spring.jpa.properties.hibernate.use_sql_comments=true  # Optional: Adds comments in the SQL output
